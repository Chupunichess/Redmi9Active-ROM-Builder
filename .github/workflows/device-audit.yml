name: LineageOS 20 source audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: lineage20-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    name: Validate cattail source dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out builder configuration
        uses: actions/checkout@v4

      - name: Record runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "CPU threads: $(nproc)"
          free -h
          df -h /
          df -i /

      - name: Audit LineageOS 20 device source set
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/audit-lineage20.sh "${RUNNER_TEMP}/blossom-lineage20-audit" 2>&1 | tee source-audit.log

      - name: Upload source audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage20-source-audit-log
          path: source-audit.log
          if-no-files-found: ignore
          retention-days: 14
