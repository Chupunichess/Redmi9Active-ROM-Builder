name: LineageOS 20 build capacity check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rom-build.yml"

permissions:
  contents: read

jobs:
  capacity:
    name: Check whether free GitHub runner can build Android
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Measure runner capacity
        shell: bash
        run: |
          set -euo pipefail
          DISK_GB="$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')"
          RAM_GB="$(awk '/MemTotal/ { printf "%d", $2 / 1024 / 1024 }' /proc/meminfo)"
          CPU_THREADS="$(nproc)"

          echo "## LineageOS 20 ROM build feasibility" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Measured | Android build planning baseline |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Free disk | ${DISK_GB} GB | 400 GB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAM | ${RAM_GB} GB | 64 GB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CPU threads | ${CPU_THREADS} | 8+ recommended |" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if (( DISK_GB >= 400 && RAM_GB >= 64 )); then
            echo "**Capacity check passed.** The runner meets the planning baseline." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Capacity check failed.** No full Android source sync or compilation was attempted." >> "$GITHUB_STEP_SUMMARY"
            echo "The free hosted runner is too small for this ROM build." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Insufficient disk/RAM for full Android source sync and compilation."
          fi

          echo
          echo "Runner details:"
          nproc
          free -h
          df -h /
