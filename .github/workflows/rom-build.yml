name: LineageOS 20 ROM build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rom-build.yml"

permissions:
  contents: read

jobs:
  workflow-check:
    name: Check workflow registration
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Report runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub Actions workflow parser accepted this job."
          nproc
          free -h
          df -h /
