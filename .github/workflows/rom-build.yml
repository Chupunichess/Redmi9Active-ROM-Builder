name: LineageOS 20 ROM build attempt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rom-build.yml"
      - "manifests/lineage-20-blossom.xml"
      - "config/target.env"

permissions:
  contents: write

concurrency:
  group: lineage20-rom-build
  cancel-in-progress: false

jobs:
  build:
    name: Sync and compile LineageOS 20 for blossom
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      WORKSPACE: ${{ github.workspace }}/../lineage20-src
      ROM_MANIFEST_URL: https://github.com/LineageOS/android.git
      ROM_BRANCH: lineage-20.0
      BUILD_JOBS: "2"

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/swift /usr/local/.ghcup
          docker system prune --all --force || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      - name: Install repo launcher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          sudo install -m 0755 repo /usr/local/bin/repo
          repo version

      - name: Initialize LineageOS source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init --depth=1 -u "$ROM_MANIFEST_URL" -b "$ROM_BRANCH"
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifests/lineage-20-blossom.xml" .repo/local_manifests/blossom.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse(".repo/local_manifests/blossom.xml")
          print("Local device manifest is valid.")
          PY

      - name: Sync complete LineageOS source tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          echo "Disk before repo sync:"
          df -h /
          repo sync -c -j2 --no-clone-bundle --no-tags --fail-fast 2>&1 | tee "$GITHUB_WORKSPACE/source-sync.log"
          echo "Disk after repo sync:"
          df -h /
          du -sh "$WORKSPACE"
          repo list | tee "$GITHUB_WORKSPACE/synced-projects.txt"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush python-is-python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk
          git lfs install
          java -version
          echo "Disk after dependencies:"
          df -h /

      - name: Configure and compile ROM
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch lineage_blossom-userdebug
          mka bacon -j"$BUILD_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/rom-build.log"

      - name: Verify and checksum ROM package
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_OUT="$WORKSPACE/out/target/product/blossom"
          mkdir -p "$GITHUB_WORKSPACE/release-files"
          mapfile -t ROM_ZIPS < <(find "$PRODUCT_OUT" -maxdepth 1 -type f -name '*.zip' -size +100M)
          if (( ${#ROM_ZIPS[@]} == 0 )); then
            echo "::error::Build finished without producing a ROM ZIP larger than 100 MB."
            find "$PRODUCT_OUT" -maxdepth 1 -type f -printf '%f %s bytes\n' || true
            exit 1
          fi
          cp "${ROM_ZIPS[@]}" "$GITHUB_WORKSPACE/release-files/"
          cd "$GITHUB_WORKSPACE/release-files"
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          du -sh .

      - name: Publish ROM release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage20-${{ github.run_number }}
          name: "Experimental LineageOS 20 for Redmi 9 Active - build ${{ github.run_number }}"
          body: |
            Experimental unofficial LineageOS 20 build for the Xiaomi blossom family.
            Intended variant: Redmi 9 Active (cattail).

            This is an experimental build and has not been independently verified as bootable.
            Verify the checksum, device compatibility and recovery/rollback options before flashing.
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage20-build-diagnostics
          path: |
            source-sync.log
            synced-projects.txt
            rom-build.log
          if-no-files-found: ignore
          retention-days: 7
