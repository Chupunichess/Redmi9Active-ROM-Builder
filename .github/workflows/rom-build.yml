name: LineageOS 20 ROM build attempt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rom-build.yml"
      - "manifests/lineage-20-blossom.xml"
      - "config/target.env"

permissions:
  contents: write

concurrency:
  group: lineage20-rom-build
  cancel-in-progress: false

jobs:
  build:
    name: Sync and compile LineageOS 20 for blossom
    runs-on: depot-ubuntu-22.04-32
    timeout-minutes: 360
    env:
      WORKSPACE: ${{ github.workspace }}/../lineage20-src
      ROM_MANIFEST_URL: https://github.com/LineageOS/android.git
      ROM_BRANCH: lineage-20.0
      BUILD_JOBS: "24"

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /

          # Remove preinstalled toolchains not needed for an Android 13 build.
          sudo rm -rf \
            /usr/share/dotnet /usr/lib/dotnet /opt/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /opt/microsoft/powershell \
            /usr/local/lib/android /usr/lib/android-sdk /opt/android-sdk \
            /usr/share/swift /usr/local/swift /opt/swift \
            /usr/local/share/chromium /opt/google/chrome \
            /usr/lib/firefox /usr/lib/chromium /usr/lib/chromium-browser

          # Actions supplies its own Node runtime; Android uses JDK 11.
          sudo rm -rf /opt/hostedtoolcache/*
          sudo rm -rf /home/runner/.cache/* /root/.cache/*
          sudo rm -rf /var/lib/apt/lists/*
          docker system prune --all --force --volumes || true
          sudo apt-get clean

          echo "Disk after cleanup:"
          df -h /
          echo "CPU and memory:"
          nproc
          free -h

      - name: Install repo launcher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          sudo install -m 0755 repo /usr/local/bin/repo
          repo version

      - name: Initialize LineageOS source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init --depth=1 -u "$ROM_MANIFEST_URL" -b "$ROM_BRANCH"
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifests/lineage-20-blossom.xml" .repo/local_manifests/blossom.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse(".repo/local_manifests/blossom.xml")
          print("Local device manifest is valid.")
          PY

      - name: Sync complete LineageOS source tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          echo "Disk before repo sync:"
          df -h /
          repo sync -c -j8 --no-clone-bundle --no-tags --fail-fast 2>&1 | tee "$GITHUB_WORKSPACE/source-sync.log"
          echo "Disk after repo sync:"
          df -h /
          du -sh "$WORKSPACE"
          repo list | tee "$GITHUB_WORKSPACE/synced-projects.txt"

      - name: Point LineageOS to the supplied prebuilt kernel headers
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_BOARD_CONFIG="$WORKSPACE/device/xiaomi/blossom/BoardConfig.mk"
          KERNEL_HEADERS="$WORKSPACE/device/xiaomi/blossom-kernel/headers"
          test -f "$DEVICE_BOARD_CONFIG"
          test -f "$KERNEL_HEADERS/Makefile"
          python3 - "$DEVICE_BOARD_CONFIG" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()
          setting = "TARGET_KERNEL_SOURCE := device/xiaomi/blossom-kernel/headers"
          if setting not in content:
              # Append the variable instead of relying on a comment/section marker.
              # BoardConfig.mk is parsed as a whole, so its position is immaterial.
              path.write_text(content.rstrip() + "\\n\\n" + setting + "\\n")
          print("Configured TARGET_KERNEL_SOURCE to use the device's supplied prebuilt-kernel headers wrapper.")
          PY
          grep -n "TARGET_KERNEL_SOURCE" "$DEVICE_BOARD_CONFIG"
          echo "Header wrapper Makefile:"
          sed -n '1,40p' "$KERNEL_HEADERS/Makefile"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libncurses5 libtinfo5 \
            libssl-dev libxml2 libxml2-utils lzop pngcrush python-is-python3 rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk
          git lfs install
          java -version
          echo "Checking legacy Clang runtime libraries:"
          ldconfig -p | grep -E 'lib(ncurses|tinfo)\.so\.5'
          echo "Checking bundled Android Clang:"
          "$WORKSPACE/prebuilts/clang/host/linux-x86/clang-3289846/bin/clang" --version
          echo "Disk after dependencies:"
          df -h /

      - name: Check free disk before compilation
        shell: bash
        run: |
          set -euo pipefail
          AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
          AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
          echo "Available disk before compilation: ${AVAILABLE_GB} GiB"
          if (( AVAILABLE_GB < 35 )); then
            echo "::error::Only ${AVAILABLE_GB} GiB remains. Stopping before compilation to avoid a predictable disk-full failure."
            exit 1
          fi

      - name: Configure and compile ROM
        shell: bash
        run: |
          # Android envsetup uses intentionally unset shell variables.
          # Keep errexit and pipefail, but do not enable nounset (-u).
          set -eo pipefail
          cd "$WORKSPACE"
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch lineage_blossom-userdebug
          mka bacon -j"$BUILD_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/rom-build.log"

      - name: Verify and checksum ROM package
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_OUT="$WORKSPACE/out/target/product/blossom"
          mkdir -p "$GITHUB_WORKSPACE/release-files"
          mapfile -t ROM_ZIPS < <(find "$PRODUCT_OUT" -maxdepth 1 -type f -name '*.zip' -size +100M)
          if (( ${#ROM_ZIPS[@]} == 0 )); then
            echo "::error::Build finished without producing a ROM ZIP larger than 100 MB."
            find "$PRODUCT_OUT" -maxdepth 1 -type f -printf '%f %s bytes\\n' || true
            exit 1
          fi
          cp "${ROM_ZIPS[@]}" "$GITHUB_WORKSPACE/release-files/"
          cd "$GITHUB_WORKSPACE/release-files"
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          du -sh .

      - name: Publish ROM release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage20-${{ github.run_number }}
          name: "Experimental LineageOS 20 for Redmi 9 Active - build ${{ github.run_number }}"
          body: |
            Experimental unofficial LineageOS 20 build for the Xiaomi blossom family.
            Intended variant: Redmi 9 Active (cattail).

            This is an experimental build and has not been independently verified as bootable.
            Verify the checksum, device compatibility and recovery/rollback options before flashing.
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage20-build-diagnostics
          path: |
            source-sync.log
            synced-projects.txt
            rom-build.log
          if-no-files-found: ignore
          retention-days: 7
